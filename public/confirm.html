<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>データ確認 - 筋トレ歴史の記録</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <a href="index.html" class="back-btn"
          ><i class="fa-solid fa-chevron-left"></i> ホームへ</a
        >
      </header>

      <main>
        <h2 class="confirm-title">
          <i class="fa-solid fa-check-circle"></i> 記録完了
        </h2>
        <p class="confirm-date" id="day-date"></p>

        <!-- この日の記録が JS でここに並ぶ -->
        <div id="record-list" class="record-list">読み込み中...</div>
      </main>

      <!-- 機能ボタン -->
      <div class="bottom-action-bar">
        <a id="add-link" href="input.html" class="btn btn-secondary">
          <i class="fa-solid fa-plus"></i> 種目追加
        </a>
        <a href="index.html" class="btn btn-primary">完了 (ホーム)</a>
      </div>
    </div>

    <script type="module" src="js/day-view.js"></script>
  </body>
</html>
