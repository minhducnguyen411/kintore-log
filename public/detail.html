<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=No"
    />
    <title>トレーニング詳細 - 筋トレ歴史の記録</title>
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <!-- back to home -->
        <a href="index.html" class="back-btn"
          ><i class="fa-solid fa-chevron-left"></i> ホームへ</a
        >
      </header>

      <main>
        <!-- auto change date -->
        <h2 class="detail-header-title">
          <i class="fa-regular fa-calendar-check"></i>
          <span id="history-date">2026年07月--日</span> の記録
        </h2>

        <!-- sample data 1 -->
        <div class="record-card">
          <div class="record-card-header">
            <span class="exercise-name">Squat</span>
          </div>
          <table class="record-table">
            <tr>
              <th>重量 (kg)</th>
              <td>80 - 85 - 90</td>
            </tr>
            <tr>
              <th>レップ</th>
              <td>12 - 10 - 8</td>
            </tr>
            <tr>
              <th>セット</th>
              <td>3</td>
            </tr>
            <tr>
              <th>インターバル</th>
              <td>2'30"</td>
            </tr>
          </table>
          <div class="memo-box">
            メモ: 足の調子が良かった。次回は95kgに挑戦する。
          </div>
        </div>

        <!-- sample data 2 -->
        <div class="record-card">
          <div class="record-card-header">
            <span class="exercise-name">Leg Press</span>
          </div>
          <table class="record-table">
            <tr>
              <th>重量 (kg)</th>
              <td>120 - 120 - 130</td>
            </tr>
            <tr>
              <th>レップ</th>
              <td>10 - 10 - 8</td>
            </tr>
            <tr>
              <th>セット</th>
              <td>3</td>
            </tr>
            <tr>
              <th>インターバル</th>
              <td>2'00"</td>
            </tr>
          </table>
        </div>
      </main>
    </div>

    <script>
      /* --- set day by link--- */

      // 1. get link
      const urlParams = new URLSearchParams(window.location.search);

      // 2. set day by ?day in link
      const selectedDay = urlParams.get("day");

      // 3. day setting
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");

      // 4. print out
      document.getElementById("history-date").innerText =
        `${year}年${month}月${selectedDay}日`;
    </script>
  </body>
</html>
