<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--携帯に表示できる-->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=No"
    />
    <title>筋トレ歴史の記録</title>

    <!-- フロント併合 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- 1-1: Header (web name & date) -->
      <header>
        <h1 class="site-title">筋トレ歴史の記録</h1>
        <div class="current-date" id="header-date">
          <!--id for javascript detect date-->
          <i class="fa-regular fa-calendar-days"></i>
          <span>読み込み中...</span>
        </div>
      </header>

      <main>
        <!-- 1-2: 記録ボタン -->
        <a href="input.html" class="train-record">
          <i class="fa-solid fa-plus"></i> 今日の記録
        </a>

        <!-- 1-3: 集計 -->
        <section class="summary-section">
          <div class="summary-header">
            <span class="summary-title">直近のデータ集計</span>
          </div>

          <div class="summary-content">
            <p>2026年07月11日</p>
            <ul class="exercise-list">
              <li>
                <span class="ex-name">Bench Press</span>
                <span class="ex-max-weight">40kg</span>
              </li>
              <li>
                <span class="ex-name">Incline Dumbbell Press</span>
                <span class="ex-max-weight">14kg</span>
              </li>
              <li>
                <span class="ex-name">Lat Pulldown</span>
                <span class="ex-max-weight">36kg</span>
              </li>
              <li>
                <span class="ex-name">Barbell Row</span>
                <span class="ex-max-weight">20kg</span>
              </li>
            </ul>
          </div>
        </section>

        <!-- 1-4: カレンダー -->
        <section class="calendar-section">
          <h2><i class="fa-solid fa-clock-rotate-left"></i> 履歴カレンダー</h2>
          <div class="calendar-grid">
            <div class="day-header">日</div>
            <div class="day-header">月</div>
            <div class="day-header">火</div>
            <div class="day-header">水</div>
            <div class="day-header">木</div>
            <div class="day-header">金</div>
            <div class="day-header">土</div>

            <!-- Giả lập các ngày trong tháng -->
            <div class="day-cell empty"></div>
            <div class="day-cell empty"></div>
            <div class="day-cell empty"></div>
            <div class="day-cell">1</div>
            <div class="day-cell">2</div>
            <div class="day-cell">3</div>
            <a class="day-cell active" href="detail.html?day=04">4</a>

            <div class="day-cell">5</div>
            <a class="day-cell active" href="detail.html?day=06">6</a>
            <div class="day-cell">7</div>
            <div class="day-cell">8</div>
            <a class="day-cell active" href="detail.html?day=09">9</a>
            <div class="day-cell">10</div>
            <a class="day-cell active" href="detail.html?day=11">11</a>
            <div class="day-cell">12</div>
            <div class="day-cell">13</div>
            <div class="day-cell">14</div>
            <div class="day-cell">15</div>
            <div class="day-cell">16</div>
            <div class="day-cell">17</div>
            <div class="day-cell">18</div>
            <div class="day-cell">19</div>
            <div class="day-cell">20</div>
            <div class="day-cell">21</div>
            <div class="day-cell">22</div>
            <div class="day-cell">23</div>
            <div class="day-cell">24</div>
            <div class="day-cell">25</div>
            <div class="day-cell">26</div>
            <div class="day-cell">27</div>
            <div class="day-cell">28</div>
            <div class="day-cell">29</div>
            <div class="day-cell">30</div>
            <div class="day-cell">31</div>
          </div>
        </section>
      </main>

      <!-- 1-5: Footer -->
      <footer>Copy right by @minhducnguyen<br /></footer>
    </div>

    <script>
      function updateHeaderDate() {
        // 1. take today
        const today = new Date();

        // 2. separate day, month, year
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        // 3. change to YYYY年MM月DD日
        const formattedDate = `${year}年${month}月${day}日`;

        // 4. change HTML
        const dateElement = document.getElementById("header-date");
        if (dateElement) {
          dateElement.innerHTML = `<i class="fa-regular fa-calendar-days"></i> <span>${formattedDate}</span>`;
        }
      }

      // run
      window.addEventListener("DOMContentLoaded", updateHeaderDate);
    </script>
  </body>
</html>
